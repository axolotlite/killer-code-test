# Pods
---
apiVersion: v1
kind: Pod
metadata:
  name: manifest-guard-1
  namespace: manifest-guard
spec:
  hostNetwork: true
  hostPID: true
  restartPolicy: Always
  containers:
    - name: guard
      image: python:3.12-alpine
      command:
        - python
        - /scripts/secret/sync.py
      securityContext:
        privileged: true
      volumeMounts:
        - name: manifests
          mountPath: /host/manifests
        - name: backup
          mountPath: /host/backup
        - name: config-script
          mountPath: /scripts/configmap
        - name: secret-script
          mountPath: /scripts/secret
  volumes:
    - name: manifests
      hostPath:
        path: /etc/kubernetes/manifests
        type: Directory
    - name: backup
      hostPath:
        path: /var/lib/k8s-manifest-backup
        type: DirectoryOrCreate
    - name: config-script
      configMap:
        name: manifest-guard-script
    - name: secret-script
      secret:
        secretName: manifest-guard-secret

