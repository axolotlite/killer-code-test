---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest-guard
  namespace: manifest-pawn-guard
spec:
  replicas: 4
  selector:
    matchLabels:
      app: manifest-guard-deployment
  template:
    metadata:
      labels:
        app: manifest-guard-deployment
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: guard
          image: python:3.12-alpine
          command:
            - python
            - /scripts/configmap/sync.py
          securityContext:
            privileged: true
          volumeMounts:
            - name: manifests
              mountPath: /host/manifests
            - name: backup
              mountPath: /host/backup
            - name: config-script
              mountPath: /scripts/configmap
            - name: secret-script
              mountPath: /scripts/secret
      volumes:
        - name: manifests
          hostPath:
            path: /etc/kubernetes/manifests
            type: Directory
        - name: backup
          hostPath:
            path: /var/lib/k8s-manifest-backup
            type: DirectoryOrCreate
        - name: config-script
          configMap:
            name: manifest-guard-script
        - name: secret-script
          secret:
            secretName: manifest-guard-secret

