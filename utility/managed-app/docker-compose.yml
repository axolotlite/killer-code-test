  backend:
    build: ./backend
    container_name: store-backend
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
    ports:
      - "5000:5000"
    # depends_on:
    #   database:
    #     condition: service_healthy

  frontend:
    build: ./frontend
    container_name: store-frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "5000"
    ports:
      - "8080:8080"
    depends_on:
      - backend
