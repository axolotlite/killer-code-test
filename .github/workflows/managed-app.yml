name: Build Managed App Images

on:
  push:
    branches: [main]
    paths:
      - "utility/managed-app/backend/**"
      - "utility/managed-app/frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "utility/managed-app/backend/**"
      - "utility/managed-app/frontend/**"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}/managed-app

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: utility/managed-app/backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/dummy-store-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/dummy-store-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: utility/managed-app/frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/dummy-store-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/dummy-store-frontend:${{ github.sha }}
